services:
  - type: web
    name: telemedsecure-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telemedsecure-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://telemedicsecure.vercel.app
      - key: NODE_ENV
        value: production

databases:
  - name: telemedsecure-db
    databaseName: telemedsecure
    user: telemed_user
