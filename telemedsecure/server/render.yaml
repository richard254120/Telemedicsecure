services:
  - type: web
    name: telemedsecure-backend
    env: node
    # Build phase on Render has NO access to synced Secrets and runs before the
    # DB connection is guaranteed — never migrate or seed here.
    buildCommand: npm install && npm run build
    # preDeployCommand runs once after build, with all env vars/secrets injected,
    # before new instances start. `db seed` is idempotent (upsert + it refuses to
    # overwrite existing credentials unless SEED_FORCE_RESET=true).
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.gsrevckqtremfsoyhcgl:nyJH7nUPQMLPQkSq@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require&connect_timeout=30
        sync: false
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: B9wQA0kdNN8D0owVYNxSw7qErw3gqIWKotKo6YOE+io=
        sync: false
      - key: JWT_REFRESH_SECRET
        value: 4LHmeo3dJf5H0g7Hunscq/1yQn6w9J4GEoIBJ1+FX9Y=
        sync: false
      # Administrator identity created by `prisma db seed` on first boot.
      # Replace the email before deploying; the generated password is shown in
      # the Render dashboard under Secrets. Seeding refuses the built-in default
      # password when NODE_ENV=production, and the account is created with
      # mustChangePassword=true so the first login forces a rotation.
      - key: ADMIN_EMAIL
        value: admin@your-org.example
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
        sync: false
      - key: FRONTEND_URL
        value: https://telemedicsecure.vercel.app
      - key: NODE_ENV
        value: production
